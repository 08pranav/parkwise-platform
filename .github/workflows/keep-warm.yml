name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health check so the free Render service stays awake
        env:
          API_URL: https://parkwise-api-77gc.onrender.com
        run: curl -fsS --max-time 90 --retry 2 --retry-all-errors "$API_URL/api/health/"
