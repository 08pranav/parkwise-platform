          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardProfile'
          description: ''
    put:
      operationId: v1_auth_guards_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardPermissionUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuardPermissionUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuardPermissionUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardPermissionUpdate'
          description: ''
    patch:
      operationId: v1_auth_guards_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
