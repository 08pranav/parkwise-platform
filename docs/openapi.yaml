              $ref: '#/components/schemas/GuardCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuardCredential'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardCredential'
          description: ''
  /api/v1/auth/guards/{id}/:
    get:
      operationId: v1_auth_guards_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
