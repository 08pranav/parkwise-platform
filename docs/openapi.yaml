          application/json:
            schema:
              $ref: '#/components/schemas/GuardRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuardRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuardRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardRegistration'
          description: ''
  /api/v1/auth/guards/:
    get:
      operationId: v1_auth_guards_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGuardProfileList'
          description: ''
    post:
      operationId: v1_auth_guards_create
      tags:
