openapi: 3.0.3
info:
  title: Parking Slot Booking API
  version: 1.0.0
  description: API for parking slot booking, payment, and QR-based entry/exit
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Liveness/readiness probe used by Render and the keep-warm workflow.

        503 when the database is unreachable (the API cannot serve). When only Redis is
        down the API still serves requests, so it answers 200 with ``status: degraded``.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/dashboard/:
    get:
      operationId: v1_admin_dashboard_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/demo/fast-forward/:
    post:
      operationId: v1_admin_demo_fast_forward_create
      description: |-
        Demo only: move a booking N minutes into the past so an overstay can be shown live.

        Both the booking window and the check-in time shift together, so an active booking
        looks as if the driver arrived earlier and is now past the end time.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/refunds/:
    get:
      operationId: v1_admin_refunds_retrieve
      description: |-
        GET  /api/v1/admin/refunds/        - list all refunds (audit trail)
        POST /api/v1/admin/refunds/        - initiate a refund for a booking
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_admin_refunds_create
      description: |-
        GET  /api/v1/admin/refunds/        - list all refunds (audit trail)
        POST /api/v1/admin/refunds/        - initiate a refund for a booking
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/refunds/lookup/:
    get:
      operationId: v1_admin_refunds_lookup_retrieve
      description: |-
        GET /api/v1/admin/refunds/lookup/?booking_id=<uuid>

        Returns a snapshot of the booking and its latest captured payment so
        the super admin can review the details before issuing a refund.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/reset-demo/:
    post:
      operationId: v1_admin_reset_demo_create
      description: Wipe and reseed the demo data. Disabled unless DEMO_MODE is on;
        guarded by a bearer token.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/societies/{society_id}/stats/:
    get:
      operationId: v1_admin_societies_stats_retrieve
      parameters:
      - in: path
        name: society_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
