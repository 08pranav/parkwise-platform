name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health check so the free Render service stays awake
        env:
          API_URL: ${{ secrets.API_URL }}
        run: curl -fsS --max-time 60 "$API_URL/api/health/"
