components:
  schemas:
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_number:
          type: string
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        vehicle:
          allOf:
          - $ref: '#/components/schemas/Vehicle'
          readOnly: true
        slot:
          type: string
          format: uuid
          readOnly: true
        slot_number:
          type: string
          readOnly: true
        society_name:
          type: string
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        owner_email:
          type: string
          readOnly: true
        owner_phone:
          type: string
          readOnly: true
        society_address:
          type: string
          readOnly: true
        society_city:
          type: string
          readOnly: true
        society_state:
          type: string
          readOnly: true
        society_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
        society_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        actual_entry:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        actual_exit:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        base_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        surge_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        surge_multiplier:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        amount_paid:
          type: string
          readOnly: true
        payment_status:
          type: string
          readOnly: true
        lock_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actual_entry
      - actual_exit
      - amount
      - amount_paid
      - base_amount
      - booking_number
      - created_at
      - end_time
      - id
      - lock_expires_at
      - owner_email
      - owner_name
      - owner_phone
      - payment_status
      - slot
      - slot_number
      - society_address
      - society_city
      - society_latitude
      - society_longitude
      - society_name
      - society_state
      - start_time
      - status
      - surge_amount
      - surge_multiplier
      - user
      - vehicle
    BookingStatusEnum:
      enum:
      - pending_payment
      - confirmed
      - active
      - completed
      - cancelled
      - no_show
      - expired
      - partially_refunded
      type: string
      description: |-
        * `pending_payment` - Pending Payment
        * `confirmed` - Confirmed
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `no_show` - No Show
        * `expired` - Expired
        * `partially_refunded` - Partially Refunded
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    GuardCredential:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
        can_scan_entry:
          type: boolean
          default: true
        can_scan_exit:
          type: boolean
          default: true
      required:
      - full_name
      - phone
    GuardPermissionUpdate:
      type: object
      properties:
        can_scan_entry:
          type: boolean
        can_scan_exit:
          type: boolean
    GuardProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 15
        full_name:
          type: string
          maxLength: 150
        device_name:
          type: string
          readOnly: true
        can_scan_entry:
          type: boolean
        can_scan_exit:
          type: boolean
        temporary_password:
          type: string
          readOnly: true
        society_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_name
      - email
      - full_name
      - id
      - phone
      - society_name
      - temporary_password
    GuardRegistration:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 15
        password:
          type: string
          writeOnly: true
          minLength: 8
        society_id:
          type: string
          format: uuid
      required:
      - email
      - full_name
      - password
      - phone
      - society_id
    NotificationTypeEnum:
      enum:
      - join_request
      - join_approved
      - join_rejected
      - slot_pending
      - slot_approved
      - slot_rejected
      type: string
      description: |-
        * `join_request` - Join Request
        * `join_approved` - Join Approved
        * `join_rejected` - Join Rejected
        * `slot_pending` - Slot Pending
        * `slot_approved` - Slot Approved
        * `slot_rejected` - Slot Rejected
    OwnershipTypeEnum:
      enum:
