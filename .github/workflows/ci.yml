name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: parking_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=apps --cov-report=term
      - name: Production settings pass the deploy checks
        env:
          DJANGO_SETTINGS_MODULE: parking_platform.settings.production
          SECRET_KEY: ci-only-secret-key-with-plenty-of-length-and-variety-0123456789-abcdefXYZ
          QR_SIGNING_SECRET: ci-only-qr-secret
          ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: parking_platform.settings.test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze every package
        run: |
          for d in packages/core apps/user_app apps/owner_app apps/admin_app apps/guard_app apps/super_admin_app; do
            (cd $d && flutter analyze --fatal-infos) || exit 1
          done
      - name: Test every package
        run: |
          for d in packages/core apps/user_app apps/owner_app apps/admin_app apps/guard_app apps/super_admin_app; do
            (cd $d && flutter test) || exit 1
          done
      - name: Web builds
        run: |
          for app in user_app owner_app admin_app guard_app super_admin_app; do
            (cd apps/$app && flutter build web --release --dart-define=API_BASE_URL=https://api.example.com)
          done
